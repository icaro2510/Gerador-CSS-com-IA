<!doctype html>
<!--VERSAO DO HTML QUE ESTA SENDO UTILIZADA-->
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <!---PADRÃO DE CARACTERES--->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevClub - Gerador de IA</title>
    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <h1>CSS Gerador <span>com IA ⚡️</span></h1>

    <p>Descreva o que você imagina e veja a mágica acontecer!</p>

    <textarea
      rows="3"
      class="caixa-texto"
      placeholder="Ex: Bola azul pingando"
    ></textarea>
    <!--TAG DE AREA DE TEXTO-->

    <button class="botao-gerar">Gerar Código⚡</button>

    <!--DIV É UMA CAIXA INVISIVEL-->
    <div class="resultado">
      <div>
        <h2>Resultado do Código</h2>
        <p class="bloco-codigo"></p>
      </div>

      <div>
        <h2>Visualização</h2>
        <iframe class="resultado-codigo"></iframe>
      </div>

    </div>
  </body>

  <script src="script.js"></script>
</html>
